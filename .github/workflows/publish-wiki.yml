name: Publish Wiki

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'wiki/**'
      - '.github/workflows/publish-wiki.yml'

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v7

      - name: Sync wiki content
        env:
          WIKI_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail
          if ! git ls-remote "$WIKI_REMOTE" HEAD >/dev/null 2>&1; then
            echo "::notice title=Wiki not initialized::Open https://github.com/${GITHUB_REPOSITORY}/wiki, create the first Home page once, then rerun this workflow."
            {
              echo "## Wiki not initialized"
              echo
              echo "GitHub has wiki enabled for \`${GITHUB_REPOSITORY}\`, but the hidden wiki git repo is not exported yet."
              echo "Create the first page once at https://github.com/${GITHUB_REPOSITORY}/wiki, then rerun this workflow to publish \`wiki/\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          wiki_repo="$(mktemp -d)"
          cp -a wiki/. "$wiki_repo/"
          cd "$wiki_repo"
          git init -b master
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to commit"
          else
            git commit -m "docs: auto-publish wiki from main repo"
            git push --force "$WIKI_REMOTE" master
          fi

name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - ".vscode/**"
      - ".copilot/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - ".vscode/**"
      - ".copilot/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  COVERAGE_THRESHOLD: "85"
  PIP_CACHE_FILES: |
    requirements.txt
    .github/workflows/ci.yml

jobs:

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: pip install flake8
      - run: flake8 loofi-fedora-tweaks/ --max-line-length=150 --ignore=E501,W503,E402,E722,E203

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: pip install mypy PyQt6-stubs
      - run: mypy loofi-fedora-tweaks/ --ignore-missing-imports --no-error-summary

  docs_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: pip install build 'defusedxml>=0.7.1'
      - run: python3 scripts/check_packaging_manifest.py --build
      - run: python3 scripts/gen_tweaks_doc.py --check
      - run: python3 scripts/check_translation_inventory.py --check
      - run: python3 scripts/bump_version.py --check

  stabilization_rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python3 scripts/check_stabilization_rules.py
      - run: PYTHONPATH=loofi-fedora-tweaks python3 scripts/validate_architecture.py

  fedora_review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run Fedora review in privileged Fedora 44 container
        run: |
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            fedora:44 \
            /bin/bash -lc '
              set -euo pipefail
              dnf install -y --setopt=install_weak_deps=False \
                --disablerepo=fedora-cisco-openh264 \
                git rpm-build python3 python3-devel python3-defusedxml desktop-file-utils \
                libappstream-glib systemd-rpm-macros fedora-review mock
              bash scripts/build_rpm.sh
              bash scripts/build_srpm.sh
              useradd --create-home reviewer
              usermod -a -G mock reviewer
              su -s /bin/bash reviewer -c \
                "cd /workspace && python3 scripts/check_fedora_review.py"
              mkdir -p review-input
              cp rpmbuild/RPMS/noarch/*.rpm rpmbuild/SRPMS/*.src.rpm \
                loofi-fedora-tweaks.spec review-input/
              chown -R reviewer:reviewer review-input
              su -s /bin/bash reviewer -c \
                "cd /workspace/review-input && fedora-review -n loofi-fedora-tweaks -r -p -m fedora-44-x86_64 --no-colors"
            '

  fedora_installed_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and inspect the installed RPM in Fedora 44
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            fedora:44 \
            /bin/bash -lc '
              set -euo pipefail
              dnf install -y --setopt=install_weak_deps=False \
                --disablerepo=fedora-cisco-openh264 \
                git rpm-build python3 python3-devel python3-defusedxml desktop-file-utils \
                libappstream-glib systemd-rpm-macros util-linux
              bash scripts/build_rpm.sh
              dnf install -y util-linux ./rpmbuild/RPMS/noarch/*.rpm
              useradd --create-home --shell /bin/bash smoke
              su -s /bin/bash smoke -c "loofi-fedora-tweaks --version"
              su -s /bin/bash smoke -c "loofi-fedora-tweaks --cli --version"
              su -s /bin/bash smoke -c "loofi-fedora-tweaks --cli --help"
              su -s /bin/bash smoke -c "python3 scripts/package_smoke.py --launcher /usr/bin/loofi-fedora-tweaks"
            '

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    outputs:
      junit_artifact: ${{ steps.unit_results.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 pkg-config libdbus-1-dev libglib2.0-dev
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: pip install -r requirements.txt pytest pytest-cov pytest-timeout PyQt6
      - run: python loofi-fedora-tweaks/main.py --version
      - run: python loofi-fedora-tweaks/main.py --cli --version
      - name: Run tests
        id: run_tests
        run: |
          PYTHONPATH=loofi-fedora-tweaks python -m pytest tests/ -v \
            --tb=short \
            --timeout=60 \
            --cov=loofi-fedora-tweaks \
            --cov-report=term-missing \
            --junitxml=test-results.xml
      - name: Check coverage threshold
        run: |
          PYTHONPATH=loofi-fedora-tweaks python -m coverage report \
            --fail-under=${{ env.COVERAGE_THRESHOLD }}
      - name: Preserve unit test results
        id: unit_results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 7

  test_report:
    name: Test report annotations
    if: always() && github.event_name != 'pull_request' && needs.test.outputs.junit_artifact != ''
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unit-test-results
      - name: Publish trusted unit test annotations
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: pip install bandit
      - run: bandit -r loofi-fedora-tweaks/ -ll -ii --skip B103,B104,B108,B310,B404,B603,B602 -f json -o bandit-report.json
  dependency_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit --strict --progress-spinner off -r requirements.txt

  package_sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: pip install build setuptools wheel
      - run: bash scripts/build_sdist.sh

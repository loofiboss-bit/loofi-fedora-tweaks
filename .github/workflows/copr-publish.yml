name: Publish to COPR

# Manual trigger for ad-hoc COPR publishes.
# Automatic COPR publishing is handled by the copr_publish job in auto-release.yml
# (chained directly after the release job to avoid GITHUB_TOKEN event limitations).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 48.0.0). Leave empty to use version.py."
        required: false

permissions:
  contents: read

concurrency:
  group: copr-publish
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  COPR_OWNER: "loofitheboss"
  COPR_PROJECT: "loofi-fedora-tweaks"
  COPR_PACKAGE: "loofi-fedora-tweaks"
  COPR_CHROOT: "fedora-44-x86_64"

jobs:
  publish:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 90
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git rpm-build python3 curl copr-cli dnf5-plugins

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER=$(python3 -c "exec(open('loofi-fedora-tweaks/version.py').read()); print(__version__)")
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VER}"

      - name: Validate spec version matches
        run: |
          SPEC_VER=$(grep '^Version:' loofi-fedora-tweaks.spec | awk '{print $2}')
          CODE_VER="${{ steps.version.outputs.version }}"
          if [ "$SPEC_VER" != "$CODE_VER" ]; then
            echo "::error::Spec version ($SPEC_VER) != code version ($CODE_VER)"
            exit 1
          fi

      - name: Verify release tag matches checkout
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          REMOTE_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          REMOTE_TAG_SHA="$(
            git ls-remote --tags "${REMOTE_URL}" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }'
          )"
          if [ -z "$REMOTE_TAG_SHA" ] || [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::COPR publish requires ${TAG} to peel to ${GITHUB_SHA}; found ${REMOTE_TAG_SHA:-missing}"
            exit 1
          fi
          echo "Verified ${TAG} -> ${REMOTE_TAG_SHA}"

      - name: Build SRPM
        run: bash scripts/build_srpm.sh

      - name: Configure copr-cli
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          copr_url = https://copr.fedorainfracloud.org
          login = ${{ secrets.COPR_LOGIN }}
          username = ${{ secrets.COPR_USERNAME }}
          token = ${{ secrets.COPR_TOKEN }}
          EOF
          chmod 600 ~/.config/copr

      - name: Validate exact COPR chroot
        run: |
          set -euo pipefail
          PROJECT_JSON=$(curl -fsSL "https://copr.fedorainfracloud.org/api_3/project?ownername=${COPR_OWNER}&projectname=${COPR_PROJECT}")
          AVAILABLE_CHROOTS=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(" ".join(sorted((d.get("chroot_repos") or {}).keys())))' "$PROJECT_JSON")

          if [ -z "${AVAILABLE_CHROOTS}" ]; then
            echo "::error::No chroots found for COPR project ${COPR_OWNER}/${COPR_PROJECT}"
            exit 1
          fi

          if ! printf '%s\n' ${AVAILABLE_CHROOTS} | grep -Fxq "${COPR_CHROOT}"; then
            echo "::error::Required COPR chroot ${COPR_CHROOT} is not configured on ${COPR_OWNER}/${COPR_PROJECT}"
            echo "Available chroots: ${AVAILABLE_CHROOTS}"
            exit 1
          fi
          echo "Verified exact COPR chroot: ${COPR_CHROOT}"

      - name: Test COPR auth
        run: |
          if WHO=$(copr-cli whoami 2>&1); then
            echo "::notice::COPR auth OK: logged in as ${WHO}"
          else
            echo "::error::COPR auth failed: ${WHO}. Check COPR_LOGIN, COPR_TOKEN, COPR_USERNAME secrets."
            exit 1
          fi

      - name: Submit build to COPR
        id: copr_build
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          SRPM=$(find rpmbuild/SRPMS -maxdepth 1 -type f -name "*-${VER}-*.src.rpm" -print -quit)
          if [ -z "$SRPM" ]; then
            echo "::error::No SRPM found for v${VER}"
            exit 1
          fi
          echo "Submitting ${SRPM} to COPR project ${COPR_OWNER}/${COPR_PROJECT}"
          echo "Target chroot: ${COPR_CHROOT}"
          COPR_OUT=$(copr-cli build "${COPR_OWNER}/${COPR_PROJECT}" "${SRPM}" --chroot "${COPR_CHROOT}" --nowait 2>&1)
          echo "${COPR_OUT}"

          BUILD_ID=$(printf '%s\n' "$COPR_OUT" | sed -nE 's/.*Created builds?:[[:space:]]*([0-9]+).*/\1/p' | tail -1)
          if [ -z "$BUILD_ID" ]; then
            BUILD_ID=$(printf '%s\n' "$COPR_OUT" | sed -nE 's#.*[/]build/([0-9]+)/?.*#\1#p' | tail -1)
          fi
          if [ -z "$BUILD_ID" ]; then
            echo "::error::COPR build completed but its build ID could not be parsed"
            exit 1
          fi

          BUILD_RESULTS_URL="https://download.copr.fedorainfracloud.org/results/${COPR_OWNER}/${COPR_PROJECT}/${COPR_CHROOT}"
          BUILD_ARTIFACT_URL="${BUILD_RESULTS_URL}/${BUILD_ID}-${COPR_PACKAGE}/"
          COPR_API="https://copr.fedorainfracloud.org/api_3"

          HAS_BUILD_ARTIFACTS() {
            if RESULTS_JSON=$(curl -fsSL "${BUILD_ARTIFACT_URL}/results.json" 2>/dev/null); then
              if VERSION="$VER" COPR_PACKAGE="$COPR_PACKAGE" \
                printf '%s' "$RESULTS_JSON" | \
                python3 -c 'import os, json, sys; version = os.environ.get("VERSION", ""); package = os.environ.get("COPR_PACKAGE", ""); accepted = {package, package + "-daemon", package + "-api"}; sys.exit(0 if any(item.get("name") in accepted and str(item.get("version")) == version for item in json.load(sys.stdin).get("packages", [])) else 1)'
              then
                return 0
              fi
            fi

            curl -fsSL "${BUILD_ARTIFACT_URL}/" |
              grep -Eq "href=['\"]${COPR_PACKAGE}[^'\"]*-${VER}-[0-9].*\\.fc44\\\.(x86_64|noarch)\\.rpm['\"]|href=['\"]success['\"]"
          }

          GET_BUILD_STATE() {
            if BUILD_JSON=$(curl -fsSL "${COPR_API}/build/${BUILD_ID}" 2>/dev/null); then
              python3 -c 'import json,sys; print(json.load(sys.stdin).get("state",""))' <<< "${BUILD_JSON}"
            else
              echo "unknown"
            fi
          }

          BUILD_STATE=""
          BUILD_REACHED_FINAL=0
          ARTIFACTS_READY=0
          for attempt in $(seq 1 180); do
            BUILD_STATE=$(GET_BUILD_STATE)
            echo "COPR build ${BUILD_ID} state (${attempt}/180): ${BUILD_STATE:-unknown}"

            if HAS_BUILD_ARTIFACTS; then
              echo "Detected COPR build artifacts for ${COPR_PACKAGE}-${VER} at:"
              echo "  ${BUILD_ARTIFACT_URL}"
              ARTIFACTS_READY=1
              BUILD_REACHED_FINAL=1
              break
            fi

            if [ "$BUILD_STATE" = "succeeded" ]; then
              echo "Verified COPR build ${BUILD_ID}: succeeded"
              BUILD_REACHED_FINAL=1
              break
            fi

            if [ "$BUILD_STATE" = "failed" ] || [ "$BUILD_STATE" = "canceled" ] || [ "$BUILD_STATE" = "cancelled" ]; then
              echo "::error::COPR build ${BUILD_ID} reached terminal state ${BUILD_STATE}"
              exit 1
            fi

            sleep 15
          done

          if [ "$BUILD_REACHED_FINAL" -ne 1 ]; then
            echo "::warning::COPR build ${BUILD_ID} did not reach a final 'succeeded' state within polling window (last state: ${BUILD_STATE:-unknown}). Attempting COPR repo regeneration and proceeding to package install verification to avoid false failure from delayed COPR backend state."
            if copr-cli regenerate-repos "${COPR_OWNER}/${COPR_PROJECT}"; then
              echo "Requested COPR repository regeneration for ${COPR_OWNER}/${COPR_PROJECT}"
            else
              echo "::warning::Failed to run copr-cli regenerate-repos for ${COPR_OWNER}/${COPR_PROJECT}"
            fi
          fi
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "has_build_artifacts=${ARTIFACTS_READY}" >> "$GITHUB_OUTPUT"
          echo "build_artifact_url=${BUILD_ARTIFACT_URL}" >> "$GITHUB_OUTPUT"
          echo "build_results_url=${BUILD_RESULTS_URL}" >> "$GITHUB_OUTPUT"

      - name: Verify installed COPR package version
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          HAS_BUILD_ARTIFACTS="${{ steps.copr_build.outputs.has_build_artifacts }}"
          BUILD_ARTIFACT_URL="${{ steps.copr_build.outputs.build_artifact_url }}"
          dnf copr enable -y "${COPR_OWNER}/${COPR_PROJECT}"
          INSTALLED=0
          for attempt in $(seq 1 60); do
            if dnf --refresh install -y "${COPR_PACKAGE}-${VER}"; then
              INSTALLED=1
              break
            fi
            echo "COPR repository metadata does not expose v${VER} yet (attempt ${attempt}/60)"
            sleep 20
          done
          if [ "$INSTALLED" -ne 1 ]; then
            if [ "$HAS_BUILD_ARTIFACTS" = "1" ]; then
              echo "::warning::Unable to install ${COPR_PACKAGE}-${VER} from COPR after repository refresh retries, but build artifacts are visible at:"
              echo "${BUILD_ARTIFACT_URL}"
              echo "::warning::Treating this as non-blocking since package artifacts are available in COPR results."
            else
              echo "::error::Unable to install ${COPR_PACKAGE}-${VER} from COPR after repository refresh retries"
              exit 1
            fi
          fi
          if [ "$INSTALLED" -eq 1 ]; then
            INSTALLED_VER=$(rpm -q --qf '%{VERSION}' "${COPR_PACKAGE}")
            if [ "$INSTALLED_VER" != "$VER" ]; then
              echo "::error::COPR installed version ${INSTALLED_VER}, expected ${VER}"
              exit 1
            fi
            echo "Verified installed COPR package version: ${INSTALLED_VER}"
          fi

      - name: Build summary
        run: |
          VER="${{ steps.version.outputs.version }}"
          echo "::notice::COPR build ${{ steps.copr_build.outputs.build_id }} succeeded for loofi-fedora-tweaks v${VER}"
          echo "::notice::COPR build artifacts URL: ${{ steps.copr_build.outputs.build_artifact_url }}"
          echo "::notice::COPR build results: ${{ steps.copr_build.outputs.build_results_url }}"
          echo "::notice::Target chroot: ${COPR_CHROOT}"
          echo ""
          echo "Track build status at:"
          echo "  https://copr.fedorainfracloud.org/coprs/${COPR_OWNER}/${COPR_PROJECT}/builds/"

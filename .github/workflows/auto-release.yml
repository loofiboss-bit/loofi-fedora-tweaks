name: Auto Release Pipeline

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (example: 25.0.1). Required for manual release runs."
        required: false
      dry_run:
        description: "Dry run (validate/build only, skip tag/release publish)."
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

concurrency:
  # A master push and its version-tag push target the same commit. Serialize by
  # commit so the tag run replaces the branch run instead of publishing twice.
  group: auto-release-${{ github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  COVERAGE_THRESHOLD: "85"
  PIP_CACHE_FILES: |
    requirements.txt
    .github/workflows/auto-release.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}

      - name: Resolve version and tag
        id: version
        run: |
          PY_VER=$(python -c "import sys; sys.path.insert(0,'loofi-fedora-tweaks'); from version import __version__; print(__version__)")
          echo "version=${PY_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${PY_VER}" >> "$GITHUB_OUTPUT"

      - name: Validate manual release version input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          INPUT_VER="${{ inputs.version }}"
          CODE_VER="${{ steps.version.outputs.version }}"
          if [ "$INPUT_VER" != "$CODE_VER" ]; then
            echo "::error::workflow_dispatch version '$INPUT_VER' does not match code version '$CODE_VER'"
            exit 1
          fi

      - name: Validate version alignment
        run: |
          PY_VER="${{ steps.version.outputs.version }}"
          SPEC_VER=$(grep '^Version:' loofi-fedora-tweaks.spec | awk '{print $2}')

          echo "version.py: $PY_VER"
          echo ".spec: $SPEC_VER"

          if [ "$PY_VER" != "$SPEC_VER" ]; then
            echo "::error::Version mismatch! version.py=$PY_VER, .spec=$SPEC_VER"
            exit 1
          fi

      - name: Validate release tag identity
        run: |
          set -euo pipefail
          PY_VER="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags --force origin
          REMOTE_TAG_SHA="$(
            git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }'
          )"

          if [ -z "$REMOTE_TAG_SHA" ]; then
            if [[ "${GITHUB_REF}" == "refs/tags/${TAG}" ]]; then
              echo "::error::Release event tag ${TAG} is missing from origin"
              exit 1
            fi
            echo "Tag ${TAG} does not exist yet; auto_tag may create it after all gates pass."
          elif [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag ${TAG} peels to ${REMOTE_TAG_SHA}, expected workflow commit ${GITHUB_SHA}"
            exit 1
          else
            echo "Verified ${TAG} -> ${REMOTE_TAG_SHA}"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            if [ "$PY_VER" != "$TAG_VER" ]; then
              echo "::error::Tag version ($TAG_VER) doesn't match code ($PY_VER)"
              exit 1
            fi
          fi

      - name: Validate release docs for release events
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check_release_docs.py

      - name: Validate packaging manifest
        run: |
          pip install build
          python3 scripts/check_packaging_manifest.py --build

      - name: Validate packaging scripts
        run: |
          for script in scripts/build_rpm.sh scripts/build_flatpak.sh scripts/build_sdist.sh; do
            if [ -f "$script" ]; then
              echo "✓ $script exists"
              if [ -x "$script" ]; then
                echo "  ✓ executable"
              else
                echo "::error::$script exists but is not executable"
                exit 1
              fi
            else
              echo "::error::$script missing"
              exit 1
            fi
          done

  adapter_drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: python3 scripts/sync_ai_adapters.py --check
      - run: python3 scripts/sync_ai_adapters.py --render --check

  pipeline_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate]
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflow specs exist
        run: |
          VER="v${{ needs.validate.outputs.version }}"
          TASKS=".workflow/specs/tasks-${VER}.md"
          ARCH=".workflow/specs/arch-${VER}.md"
          MISSING=0

          if [ ! -f "$TASKS" ]; then
            echo "::error::Missing task spec: $TASKS"
            MISSING=1
          fi
          if [ ! -f "$ARCH" ]; then
            echo "::error::Missing arch spec: $ARCH"
            MISSING=1
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo "Workflow specs are missing for ${VER}."
            echo "Run: python3 scripts/bump_version.py ${VER#v}"
            exit 1
          fi

      - name: Validate race-lock version
        run: |
          VER="v${{ needs.validate.outputs.version }}"
          LOCK=".workflow/specs/.race-lock.json"
          if [ ! -f "$LOCK" ]; then
            echo "::error::Race lock file missing: $LOCK"
            exit 1
          fi
          LOCK_VER=$(python3 -c "import json; print(json.load(open('$LOCK'))['version'])")
          if [ "$LOCK_VER" != "$VER" ]; then
            echo "::error::Race lock version ($LOCK_VER) does not match release version ($VER)"
            exit 1
          fi

      - name: Validate release tasks are publish-ready
        run: python3 scripts/check_release_docs.py --require-publish-ready-tasks

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: pip install flake8
      - run: flake8 loofi-fedora-tweaks/ --max-line-length=150 --ignore=E501,W503,E402,E722,E203

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: pip install mypy PyQt6-stubs
      - run: mypy loofi-fedora-tweaks/ --ignore-missing-imports --no-error-summary

  stabilization_rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python3 scripts/check_stabilization_rules.py

  fedora_review:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    needs: [build]
    if: |
      !cancelled() &&
      needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - name: Install Fedora review tool
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          --disablerepo=fedora-cisco-openh264
          python3 fedora-review mock
      - name: Download built RPM artifact
        uses: actions/download-artifact@v7
        with:
          name: rpm-package
          path: review-input
      - name: Download built SRPM artifact
        uses: actions/download-artifact@v7
        with:
          name: srpm-package
          path: review-input
      - name: Create mock-enabled reviewer
        run: |
          useradd --create-home reviewer
          usermod -a -G mock reviewer
      - name: Fedora review tooling gate
        run: >-
          su -s /bin/bash reviewer -c
          "cd '${GITHUB_WORKSPACE}' && python3 scripts/check_fedora_review.py"
      - name: Review the built RPM and SRPM
        run: |
          set -euo pipefail
          cp loofi-fedora-tweaks.spec review-input/
          chown -R reviewer:reviewer review-input
          su -s /bin/bash reviewer -c \
            "cd '${GITHUB_WORKSPACE}/review-input' && fedora-review -n loofi-fedora-tweaks -r -p -m fedora-44-x86_64 --no-colors"

  docs_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: python3 scripts/check_release_docs.py
      - run: pip install build
      - run: python3 scripts/check_packaging_manifest.py --build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 pkg-config libdbus-1-dev libglib2.0-dev
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: pip install -r requirements.txt pytest pytest-cov pytest-timeout PyQt6
      - run: python loofi-fedora-tweaks/main.py --version
      - run: python loofi-fedora-tweaks/main.py --cli --version
      - name: Run tests
        id: run_tests
        run: |
          PYTHONPATH=loofi-fedora-tweaks python -m pytest tests/ -v \
            --tb=short \
            --timeout=60 \
            --cov=loofi-fedora-tweaks \
            --cov-report=term-missing \
            --junitxml=test-results.xml
      - name: Check coverage threshold
        run: |
          PYTHONPATH=loofi-fedora-tweaks python -m coverage report \
            --fail-under=${{ env.COVERAGE_THRESHOLD }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
      - name: Test report annotations
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - run: pip install bandit
      - run: bandit -r loofi-fedora-tweaks/ -ll -ii --skip B103,B104,B108,B310,B404,B603,B602 -f json -o bandit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json

  build:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 20
    needs: [validate, pipeline_gate, adapter_drift, lint, typecheck, stabilization_rules, docs_gate, test, security]
    if: |
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.pipeline_gate.result == 'success' &&
      needs.adapter_drift.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.stabilization_rules.result == 'success' &&
      needs.test.result == 'success' &&
      needs.docs_gate.result == 'success' &&
      needs.security.result == 'success'
    steps:
      - name: Bootstrap Git for checkout
        run: dnf install -y git
      - uses: actions/checkout@v6
      - name: Install build deps
        run: dnf install -y rpm-build python3 python3-devel desktop-file-utils libappstream-glib systemd-rpm-macros
      - name: Build RPM
        run: bash scripts/build_rpm.sh
      - name: Build commit-bound SRPM
        run: bash scripts/build_srpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: rpmbuild/RPMS/noarch/*.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: srpm-package
          path: rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error

  rpm_smoke_test:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 10
    needs: [build, fedora_review]
    if: |
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.fedora_review.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - name: Download RPM artifact
        uses: actions/download-artifact@v7
        with:
          name: rpm-package
          path: rpm-install
      - name: Install RPM
        run: |
          dnf install -y ./rpm-install/*.rpm
      - name: Smoke test — verify binary exists
        run: |
          command -v loofi-fedora-tweaks || { echo "::error::Binary not found after RPM install"; exit 1; }
      - name: Smoke test — version output
        run: |
          loofi-fedora-tweaks --version
      - name: Smoke test — CLI version
        run: |
          loofi-fedora-tweaks --cli --version
      - name: Smoke test — CLI help
        run: |
          loofi-fedora-tweaks --cli --help

  build_flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, adapter_drift, lint]
    if: |
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.lint.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Add Flathub remote and install SDK
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.kde.Platform//6.10 org.kde.Sdk//6.10 com.riverbankcomputing.PyQt.BaseApp//6.10
      - name: Build Flatpak
        run: bash scripts/build_flatpak.sh
      - name: Smoke test installed Flatpak
        run: |
          sudo flatpak install -y --noninteractive --reinstall dist/flatpak/*.flatpak
          flatpak run --command=python3 org.loofi.FedoraTweaks -c "import PyQt6"
          set +e
          QT_QPA_PLATFORM=offscreen timeout 10 flatpak run org.loofi.FedoraTweaks
          rc=$?
          set -e
          test "$rc" -eq 124
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatpak-package
          path: dist/flatpak/*.flatpak
          if-no-files-found: error

  build_sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate]
    if: |
      !cancelled() &&
      needs.validate.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ${{ env.PIP_CACHE_FILES }}
      - name: Install build tools
        run: pip install build setuptools wheel
      - name: Build source distribution
        run: bash scripts/build_sdist.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdist-package
          path: dist/*.tar.gz
          if-no-files-found: error

  auto_tag:
    if: |
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.rpm_smoke_test.result == 'success' &&
      needs.build_flatpak.result == 'success' &&
      needs.build_sdist.result == 'success' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    needs: [validate, build, rpm_smoke_test, build_flatpak, build_sdist]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create version tag if missing
        run: |
          set -euo pipefail
          TAG="${{ needs.validate.outputs.tag }}"
          git fetch --tags --force origin

          REMOTE_TAG_SHA="$(
            git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }'
          )"
          if [ -n "$REMOTE_TAG_SHA" ]; then
            if [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Existing release tag ${TAG} peels to ${REMOTE_TAG_SHA}, expected ${GITHUB_SHA}"
              exit 1
            fi
            echo "Tag ${TAG} already exists and is verified at ${REMOTE_TAG_SHA}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${GITHUB_SHA}" -m "Loofi Fedora Tweaks ${TAG}"
          git push origin "${TAG}"

          REMOTE_TAG_SHA="$(
            git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }'
          )"
          if [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Pushed release tag ${TAG} peels to ${REMOTE_TAG_SHA:-missing}, expected ${GITHUB_SHA}"
            exit 1
          fi
          echo "Created and verified ${TAG} -> ${REMOTE_TAG_SHA}"

  release:
    if: |
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.rpm_smoke_test.result == 'success' &&
      needs.build_flatpak.result == 'success' &&
      needs.build_sdist.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || !inputs.dry_run) &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.version != '') ||
       github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 20
    permissions:
      contents: write
    needs:
      [validate, build, rpm_smoke_test, auto_tag, build_flatpak, build_sdist]
    steps:
      - name: Install release deps
        run: dnf install -y git python3 curl

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download RPM artifact
        uses: actions/download-artifact@v7
        with:
          name: rpm-package
          path: release-assets

      - name: Download Flatpak artifact
        uses: actions/download-artifact@v7
        with:
          name: flatpak-package
          path: release-assets

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: sdist-package
          path: release-assets

      - name: List release assets
        run: |
          echo "Release assets:"
          ls -lh release-assets/ 2>/dev/null || echo "No assets found"

      - name: Generate checksums and CycloneDX SBOM
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'loofi-fedora-tweaks.cdx.json' -printf '%f\n' | sort | xargs -r sha256sum > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, uuid
          root = pathlib.Path('.')
          components = []
          for path in sorted(root.iterdir()):
              if not path.is_file() or path.name in {'SHA256SUMS.txt', 'loofi-fedora-tweaks.cdx.json'}:
                  continue
              components.append({
                  'type': 'file', 'name': path.name,
                  'hashes': [{'alg': 'SHA-256', 'content': hashlib.sha256(path.read_bytes()).hexdigest()}],
              })
          payload = {
              'bomFormat': 'CycloneDX', 'specVersion': '1.5', 'serialNumber': f'urn:uuid:{uuid.uuid4()}',
              'version': 1, 'metadata': {'component': {'type': 'application', 'name': 'loofi-fedora-tweaks'}},
              'components': components,
          }
          pathlib.Path('loofi-fedora-tweaks.cdx.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
          sha256sum -c SHA256SUMS.txt

      - name: Resolve release tag
        id: release_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.version }}" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${{ needs.validate.outputs.tag }}"
          fi
          VERSION="${TAG#v}"

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force origin
          REMOTE_TAG_SHA="$(
            git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }'
          )"
          if [ -z "$REMOTE_TAG_SHA" ]; then
            echo "::error::Release tag ${TAG} does not exist on origin"
            exit 1
          fi
          if [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag ${TAG} peels to ${REMOTE_TAG_SHA}, expected ${GITHUB_SHA}"
            exit 1
          fi
          echo "Verified release tag ${TAG} -> ${REMOTE_TAG_SHA}"

          CODENAME=$(python3 -c "import sys; sys.path.insert(0,'loofi-fedora-tweaks'); from version import __version_codename__; print(__version_codename__)" 2>/dev/null || echo "")

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "codename=${CODENAME}" >> "$GITHUB_OUTPUT"

      - name: Generate release body
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          VERSION="${{ steps.release_meta.outputs.version }}"
          CODENAME="${{ steps.release_meta.outputs.codename }}"
          NOTES_FILE="docs/releases/RELEASE-NOTES-v${VERSION}.md"
          LEGACY_NOTES_FILE="RELEASE-NOTES-v${VERSION}.md"

          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" /tmp/release-body.md
          elif [ -f "$LEGACY_NOTES_FILE" ]; then
            cp "$LEGACY_NOTES_FILE" /tmp/release-body.md
          else
            cat > /tmp/release-body.md <<EOF
          ## Loofi Fedora Tweaks ${TAG}${CODENAME:+ — ${CODENAME}}

          ### Installation
          \`\`\`bash
          pkexec dnf install ./loofi-fedora-tweaks-*.rpm
          \`\`\`

          ### Changes
          See [CHANGELOG](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.
          EOF
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "Loofi Fedora Tweaks ${{ steps.release_meta.outputs.tag }}${{ steps.release_meta.outputs.codename && format(' — {0}', steps.release_meta.outputs.codename) || '' }}"
          body_path: /tmp/release-body.md
          draft: false
          prerelease: ${{ contains(steps.release_meta.outputs.tag, '-rc') || contains(steps.release_meta.outputs.tag, '-beta') || contains(steps.release_meta.outputs.tag, '-alpha') }}
          files: |
            release-assets/*.rpm
            release-assets/*.flatpak
            release-assets/*.AppImage
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
            release-assets/*.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: always()
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          ASSETS=$(ls release-assets/ 2>/dev/null | tr '\n' ', ' || echo "none")
          echo "::notice::Published release ${TAG} with artifacts: ${ASSETS}"

  # Publish to COPR directly after release (avoids GITHUB_TOKEN event limitation
  # where release:published events from GITHUB_TOKEN don't trigger other workflows)
  copr_publish:
    if: |
      !cancelled() &&
      needs.release.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 90
    needs: [validate, release]
    env:
      COPR_OWNER: "loofitheboss"
      COPR_PROJECT: "loofi-fedora-tweaks"
      COPR_PACKAGE: "loofi-fedora-tweaks"
      COPR_CHROOT: "fedora-44-x86_64"
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git rpm-build python3 curl copr-cli dnf5-plugins

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag matches checkout
        run: |
          set -euo pipefail
          TAG="v${{ needs.validate.outputs.version }}"
          REMOTE_TAG_SHA="$(
            git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }'
          )"
          if [ -z "$REMOTE_TAG_SHA" ] || [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::COPR publish requires ${TAG} to peel to ${GITHUB_SHA}; found ${REMOTE_TAG_SHA:-missing}"
            exit 1
          fi
          echo "Verified ${TAG} -> ${REMOTE_TAG_SHA}"

      - name: Validate spec version matches
        run: |
          SPEC_VER=$(grep '^Version:' loofi-fedora-tweaks.spec | awk '{print $2}')
          CODE_VER="${{ needs.validate.outputs.version }}"
          if [ "$SPEC_VER" != "$CODE_VER" ]; then
            echo "::error::Spec version ($SPEC_VER) != code version ($CODE_VER)"
            exit 1
          fi

      - name: Build SRPM
        run: bash scripts/build_srpm.sh

      - name: Configure copr-cli
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          copr_url = https://copr.fedorainfracloud.org
          login = ${{ secrets.COPR_LOGIN }}
          username = ${{ secrets.COPR_USERNAME }}
          token = ${{ secrets.COPR_TOKEN }}
          EOF
          chmod 600 ~/.config/copr

      - name: Validate exact COPR chroot
        run: |
          set -euo pipefail
          PROJECT_JSON=$(curl -fsSL "https://copr.fedorainfracloud.org/api_3/project?ownername=${COPR_OWNER}&projectname=${COPR_PROJECT}")
          AVAILABLE_CHROOTS=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(" ".join(sorted((d.get("chroot_repos") or {}).keys())))' "$PROJECT_JSON")

          if [ -z "${AVAILABLE_CHROOTS}" ]; then
            echo "::error::No chroots found for COPR project ${COPR_OWNER}/${COPR_PROJECT}"
            exit 1
          fi

          if ! printf '%s\n' ${AVAILABLE_CHROOTS} | grep -Fxq "${COPR_CHROOT}"; then
            echo "::error::Required COPR chroot ${COPR_CHROOT} is not configured on ${COPR_OWNER}/${COPR_PROJECT}"
            echo "Available chroots: ${AVAILABLE_CHROOTS}"
            exit 1
          fi
          echo "Verified exact COPR chroot: ${COPR_CHROOT}"

      - name: Test COPR auth
        run: |
          if WHO=$(copr-cli whoami 2>&1); then
            echo "::notice::COPR auth OK: logged in as ${WHO}"
          else
            echo "::error::COPR auth failed: ${WHO}. Check COPR_LOGIN, COPR_TOKEN, COPR_USERNAME secrets."
            exit 1
          fi

      - name: Submit build to COPR
        id: copr_build
        run: |
          set -euo pipefail
          VER="${{ needs.validate.outputs.version }}"
          SRPM=$(find rpmbuild/SRPMS -maxdepth 1 -type f -name "*-${VER}-*.src.rpm" -print -quit)
          if [ -z "$SRPM" ]; then
            echo "::error::No SRPM found for v${VER}"
            exit 1
          fi
          echo "Submitting ${SRPM} (v${VER}) to COPR project ${COPR_OWNER}/${COPR_PROJECT}"
          echo "Target chroot: ${COPR_CHROOT}"
          COPR_OUT=$(copr-cli build "${COPR_OWNER}/${COPR_PROJECT}" "${SRPM}" --chroot "${COPR_CHROOT}" 2>&1)
          echo "${COPR_OUT}"

          BUILD_ID=$(printf '%s\n' "$COPR_OUT" | sed -nE 's/.*Created builds?:[[:space:]]*([0-9]+).*/\1/p' | tail -1)
          if [ -z "$BUILD_ID" ]; then
            BUILD_ID=$(printf '%s\n' "$COPR_OUT" | sed -nE 's#.*[/]build/([0-9]+)/?.*#\1#p' | tail -1)
          fi
          if [ -z "$BUILD_ID" ]; then
            echo "::error::COPR build completed but its build ID could not be parsed"
            exit 1
          fi

          STATUS=$(copr-cli status "$BUILD_ID" | tr -d '[:space:]')
          if [ "$STATUS" != "succeeded" ]; then
            echo "::error::COPR build ${BUILD_ID} reached terminal status ${STATUS:-unknown}, expected succeeded"
            exit 1
          fi
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "Verified COPR build ${BUILD_ID}: succeeded"

      - name: Verify installed COPR package version
        run: |
          set -euo pipefail
          VER="${{ needs.validate.outputs.version }}"
          dnf copr enable -y "${COPR_OWNER}/${COPR_PROJECT}"
          INSTALLED=0
          for attempt in $(seq 1 12); do
            if dnf --refresh install -y "${COPR_PACKAGE}-${VER}"; then
              INSTALLED=1
              break
            fi
            echo "COPR repository metadata does not expose v${VER} yet (attempt ${attempt}/12)"
            sleep 10
          done
          if [ "$INSTALLED" -ne 1 ]; then
            echo "::error::Unable to install ${COPR_PACKAGE}-${VER} from COPR after repository refresh retries"
            exit 1
          fi
          INSTALLED_VER=$(rpm -q --qf '%{VERSION}' "${COPR_PACKAGE}")
          if [ "$INSTALLED_VER" != "$VER" ]; then
            echo "::error::COPR installed version ${INSTALLED_VER}, expected ${VER}"
            exit 1
          fi
          echo "Verified installed COPR package version: ${INSTALLED_VER}"

      - name: COPR build summary
        if: always()
        run: |
          VER="${{ needs.validate.outputs.version }}"
          echo "::notice::COPR build ${{ steps.copr_build.outputs.build_id }} succeeded for loofi-fedora-tweaks v${VER}"
          echo "::notice::Target chroot: ${COPR_CHROOT}"
          echo "Track build status at:"
          echo "  https://copr.fedorainfracloud.org/coprs/${COPR_OWNER}/${COPR_PROJECT}/builds/"

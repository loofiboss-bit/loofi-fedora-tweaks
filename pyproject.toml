[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loofi_fedora_tweaks"
version = "30.1.0"
description = "A Fedora maintenance and desktop control center with GUI and CLI modes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Loofi" }]
keywords = ["fedora", "linux", "system-management", "pyqt6", "tweaks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.7",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "flake8>=7.0", "mypy>=1.10", "pytest-cov>=5.0", "pytest-timeout>=2.3", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/loofiboss-bit/loofi-fedora-tweaks"
Repository = "https://github.com/loofiboss-bit/loofi-fedora-tweaks"
"Bug Tracker" = "https://github.com/loofiboss-bit/loofi-fedora-tweaks/issues"
Documentation = "https://github.com/loofiboss-bit/loofi-fedora-tweaks/tree/master/docs"

[project.scripts]
loofi-fedora-tweaks = "main:main"

[tool.setuptools]
package-dir = { "" = "loofi-fedora-tweaks" }
py-modules = ["main", "version"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["loofi-fedora-tweaks"]
include = [
    "assets*",
    "cli*",
    "config*",
    "core*",
    "resources*",
    "services*",
    "ui*",
    "utils*",
]
namespaces = true

[tool.setuptools.package-data]
assets = ["**/*"]
config = ["**/*"]
resources = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["loofi-fedora-tweaks"]
# These files remain available for migration and compatibility tests but are
# outside the maintained V27 product surface: retired specialist CLI/UI
# entrypoints, the removed profile/mesh stacks, and deprecated utility shims.
omit = [
    "loofi-fedora-tweaks/cli/action_plans.py",
    "loofi-fedora-tweaks/cli/commands/agent_commands.py",
    "loofi-fedora-tweaks/cli/commands/firewall_commands.py",
    "loofi-fedora-tweaks/cli/commands/hardware_commands.py",
    "loofi-fedora-tweaks/cli/commands/health_history_commands.py",
    "loofi-fedora-tweaks/cli/commands/insight_commands.py",
    "loofi-fedora-tweaks/cli/commands/monitoring_commands.py",
    "loofi-fedora-tweaks/cli/commands/network_mesh_commands.py",
    "loofi-fedora-tweaks/cli/commands/ops_commands.py",
    "loofi-fedora-tweaks/cli/commands/plugin_commands.py",
    "loofi-fedora-tweaks/cli/commands/service_package_commands.py",
    "loofi-fedora-tweaks/cli/commands/system_commands.py",
    "loofi-fedora-tweaks/cli/commands/tuning_commands.py",
    "loofi-fedora-tweaks/cli/commands/user_commands.py",
    "loofi-fedora-tweaks/core/profiles/*",
    "loofi-fedora-tweaks/core/workers/troubleshooting_worker.py",
    "loofi-fedora-tweaks/core/diagnostics/gaming_audit.py",
    "loofi-fedora-tweaks/core/export/support_bundle_v2.py",
    "loofi-fedora-tweaks/core/export/support_bundle_v13.py",
    "loofi-fedora-tweaks/services/network/mesh.py",
    "loofi-fedora-tweaks/services/desktop/tiling.py",
    "loofi-fedora-tweaks/ui/health_detail_dialog.py",
    "loofi-fedora-tweaks/ui/health_timeline_tab.py",
    "loofi-fedora-tweaks/ui/logs_tab.py",
    "loofi-fedora-tweaks/ui/monitor_tab.py",
    "loofi-fedora-tweaks/ui/performance_tab.py",
    "loofi-fedora-tweaks/ui/snapshot_tab.py",
    "loofi-fedora-tweaks/utils/desktop_utils.py",
    "loofi-fedora-tweaks/utils/firewall_manager.py",
    "loofi-fedora-tweaks/utils/flatpak_manager.py",
    "loofi-fedora-tweaks/utils/health_timeline.py",
    "loofi-fedora-tweaks/utils/kwin_tiling.py",
    "loofi-fedora-tweaks/utils/network_monitor.py",
    "loofi-fedora-tweaks/utils/network_utils.py",
    "loofi-fedora-tweaks/utils/ports.py",
    "loofi-fedora-tweaks/utils/report_exporter.py",
    "loofi-fedora-tweaks/utils/risk.py",
    "loofi-fedora-tweaks/utils/sandbox.py",
    "loofi-fedora-tweaks/utils/secureboot.py",
    "loofi-fedora-tweaks/utils/tiling.py",
    "loofi-fedora-tweaks/utils/usbguard.py",
    "loofi-fedora-tweaks/utils/wayland_display.py",
]

[tool.mypy]
ignore_missing_imports = true
warn_return_any = true
no_error_summary = true

[[tool.mypy.overrides]]
module = [
    "core.actions.*",
    "core.navigation.*",
    "core.state.*",
    "core.execution_policy",
    "core.fedora_release_policy",
    "core.product_catalog",
    "core.secrets",
    "services.storage.cloud_sync",
    "services.system.onboarding",
]
check_untyped_defs = true

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["loofi_fedora_tweaks"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loofi_fedora_tweaks"
version = "22.0.0"
description = "A Fedora maintenance and desktop control center with GUI and CLI modes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Loofi" }]
keywords = ["fedora", "linux", "system-management", "pyqt6", "tweaks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.7",
    "keyring>=25.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.128", "uvicorn>=0.30", "PyJWT>=2.13.0", "bcrypt>=4.1", "httpx>=0.27", "python-multipart>=0.0.31"]
daemon = ["dbus-python>=1.3"]
dev = ["pytest>=8.0", "flake8>=7.0", "mypy>=1.10", "pytest-cov>=5.0", "pytest-timeout>=2.3", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/loofiboss-bit/loofi-fedora-tweaks"
Repository = "https://github.com/loofiboss-bit/loofi-fedora-tweaks"
"Bug Tracker" = "https://github.com/loofiboss-bit/loofi-fedora-tweaks/issues"
Documentation = "https://github.com/loofiboss-bit/loofi-fedora-tweaks/tree/master/docs"

[project.scripts]
loofi-fedora-tweaks = "main:main"

[tool.setuptools]
package-dir = { "" = "loofi-fedora-tweaks" }
py-modules = ["main", "version"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["loofi-fedora-tweaks"]
include = [
    "api*",
    "agents*",
    "assets*",
    "cli*",
    "config*",
    "core*",
    "daemon*",
    "resources*",
    "services*",
    "ui*",
    "utils*",
]
namespaces = true

[tool.setuptools.package-data]
assets = ["**/*"]
config = ["**/*"]
resources = ["**/*"]
agents = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-v --tb=short"

[tool.mypy]
ignore_missing_imports = true
warn_return_any = true
no_error_summary = true

[[tool.mypy.overrides]]
module = [
    "core.actions.*",
    "core.navigation.*",
    "core.state.*",
    "core.execution_policy",
    "core.fedora_release_policy",
    "core.product_catalog",
    "core.secrets",
    "daemon.*",
    "services.storage.cloud_sync",
    "services.system.onboarding",
]
check_untyped_defs = true

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["loofi_fedora_tweaks"]

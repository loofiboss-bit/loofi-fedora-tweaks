app-id: org.loofi.FedoraTweaks
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
command: loofi-fedora-tweaks
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: loofi-fedora-tweaks
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/loofi-fedora-tweaks
      - cp -r loofi-fedora-tweaks/* /app/lib/loofi-fedora-tweaks/
      - mkdir -p /app/bin
      - echo '#!/bin/bash' > /app/bin/loofi-fedora-tweaks
      - echo 'export PYTHONPATH=/app/lib/loofi-fedora-tweaks' >> /app/bin/loofi-fedora-tweaks
      - echo 'python3 /app/lib/loofi-fedora-tweaks/main.py "$@"' >> /app/bin/loofi-fedora-tweaks
      - chmod +x /app/bin/loofi-fedora-tweaks
      - mkdir -p /app/share/applications
      - cp loofi-fedora-tweaks.desktop /app/share/applications/org.loofi.FedoraTweaks.desktop
      - sed -i 's/^Icon=.*/Icon=org.loofi.FedoraTweaks/' /app/share/applications/org.loofi.FedoraTweaks.desktop
      - mkdir -p /app/share/icons/hicolor/512x512/apps
      - cp loofi-fedora-tweaks/assets/icon.png /app/share/icons/hicolor/512x512/apps/org.loofi.FedoraTweaks.png
      - mkdir -p /app/share/metainfo
      - cp loofi-fedora-tweaks.metainfo.xml /app/share/metainfo/org.loofi.FedoraTweaks.metainfo.xml
      - sed -i 's#<id>loofi-fedora-tweaks</id>#<id>org.loofi.FedoraTweaks</id>#; s#<launchable type="desktop-id">loofi-fedora-tweaks.desktop</launchable>#<launchable type="desktop-id">org.loofi.FedoraTweaks.desktop</launchable>#' /app/share/metainfo/org.loofi.FedoraTweaks.metainfo.xml
    sources:
      - type: dir
        path: .
